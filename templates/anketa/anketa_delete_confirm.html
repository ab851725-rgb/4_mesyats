<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Удаление анкеты</title>
</head>
<body>
    <h1>Вы уверены, что хотите удалить анкету «{{ anketa.full_name }}»?</h1>
    <form method="POST">
        {% csrf_token %}
        <button type="submit" style="color: red;">Да, удалить безвозвратно</button>
        <a href="{% url 'anketa_detail' anketa.id %}">Нет, отмена</a>
    </form>
</body>
</html>
