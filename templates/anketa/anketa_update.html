<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Редактирование: {{ anketa.full_name }}</title>
</head>
<body>
    <h1>Редактирование анкеты: {{ anketa.full_name }}</h1>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Сохранить изменения</button>
    </form>

    <br>
    <a href="{% url 'anketa_detail' anketa.id %}">Отмена</a>
</body>
</html>
